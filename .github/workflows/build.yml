name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Etiket (tag) ve GitHub Release oluşturmak için gerekli.
permissions:
  contents: write

# Sürüm hesabı sıralı yapılmalı: iki çalışma aynı sürüm numarasını üretmesin.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    # Pinned so the ubuntu-latest -> Ubuntu 26 migration cannot change the build unexpectedly.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # bash with -eo pipefail, so failures are not hidden by "| tee"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # sürüm hesabı için commit geçmişi ve etiketler gerekir

      - name: Compute version
        id: version
        run: python3 .github/scripts/next_version.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Unit tests
        id: tests
        run: gradle :app:testDebugUnitTest --no-daemon --warning-mode all 2>&1 | tee unit-tests.log

      # Sabit imza anahtarını secret'tan çözer ve doğrular. Secret eksik veya hatalıysa HATA VERMEZ:
      # `signed=false` çıktısı verilir, aşağıda imzasız (debug) APK derlenir. Sebep All-reports.txt'e yazılır.
      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="${RUNNER_TEMP}/release.keystore"
          fallback() {
            echo "::warning::${1} Debug APK derlenecek (release imzası atlandı)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "${1}" > signing-status.txt
            rm -f "${KS}"
            exit 0
          }
          [ -n "${KEYSTORE_BASE64}" ]   || fallback "KEYSTORE_BASE64 secret'ı tanımlı değil."
          [ -n "${KEYSTORE_PASSWORD}" ] || fallback "KEYSTORE_PASSWORD secret'ı tanımlı değil."
          [ -n "${KEY_ALIAS}" ]         || fallback "KEY_ALIAS secret'ı tanımlı değil."
          [ -n "${KEY_PASSWORD}" ]      || fallback "KEY_PASSWORD secret'ı tanımlı değil."

          echo "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${KS}" 2>/dev/null \
            || fallback "KEYSTORE_BASE64 çözülemedi (geçerli bir base64 değil)."
          # Değerleri yazdırmadan hangi secret'ın yanlış olduğunu söyler.
          keytool -list -keystore "${KS}" -storepass "${KEYSTORE_PASSWORD}" >/dev/null 2>&1 \
            || fallback "Keystore açılamadı: KEYSTORE_BASE64 bozuk veya KEYSTORE_PASSWORD yanlış."
          keytool -list -keystore "${KS}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" >/dev/null 2>&1 \
            || fallback "KEY_ALIAS yanlış. Keystore'daki takma adlar: $(keytool -list -keystore "${KS}" -storepass "${KEYSTORE_PASSWORD}" 2>/dev/null | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')"
          # Anahtar şifresi testi. `keytool -keypasswd` PKCS12'de DESTEKLENMEZ ("not supported if -storetype is
          # PKCS12"); eski kontrol bu yüzden doğru şifreyle bile "KEY_PASSWORD yanlış" diyordu.
          STYPE="$(keytool -list -keystore "${KS}" -storepass "${KEYSTORE_PASSWORD}" 2>/dev/null | sed -n 's/^Keystore type: *//p' | head -n 1 | tr 'A-Z' 'a-z')"
          if [ "${STYPE}" = "pkcs12" ]; then
            # PKCS12'de Java anahtar şifresi olarak mağaza şifresini kullanır; ikisi aynı olmalı.
            [ "${KEY_PASSWORD}" = "${KEYSTORE_PASSWORD}" ] \
              || fallback "KEY_PASSWORD yanlış: PKCS12 keystore'da KEYSTORE_PASSWORD ile aynı olmalı."
          else
            # JKS: anahtarı kopyaya aktarmayı dener; yanlış anahtar şifresinde hata verir.
            rm -f "${KS}.check"
            keytool -importkeystore -srckeystore "${KS}" -srcstorepass "${KEYSTORE_PASSWORD}" \
              -srcalias "${KEY_ALIAS}" -srckeypass "${KEY_PASSWORD}" \
              -destkeystore "${KS}.check" -deststoretype PKCS12 \
              -deststorepass "${KEYSTORE_PASSWORD}" -destkeypass "${KEYSTORE_PASSWORD}" >/dev/null 2>&1 \
              || { rm -f "${KS}.check"; fallback "KEY_PASSWORD yanlış."; }
            rm -f "${KS}.check"
          fi

          echo "KEYSTORE_FILE=${KS}" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release imzası doğrulandı." > signing-status.txt

      - name: Release APK
        id: release
        # İmza doğrulandıysa release; testler başarısız olsa bile release derlemesi de raporlansın.
        if: ${{ !cancelled() && steps.key.outputs.signed == 'true' }}
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --warning-mode all -PGITHUB_CLIENT_ID="${GITHUB_CLIENT_ID}" -PVERSION_NAME="${APP_VERSION}" 2>&1 | tee release-build.log

      # İmza secret'ları eksik/hatalıysa: debug APK (Android'in debug anahtarıyla imzalı).
      - name: Debug APK (imza atlandı)
        id: debug
        if: ${{ !cancelled() && steps.key.outputs.signed != 'true' }}
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: gradle :app:assembleDebug --no-daemon --warning-mode all -PGITHUB_CLIENT_ID="${GITHUB_CLIENT_ID}" -PVERSION_NAME="${APP_VERSION}" 2>&1 | tee debug-build.log

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v7
        with:
          name: gitpush-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Yalnızca main dalında, testler ve derleme başarılıysa ve sürüm artışı gerekiyorsa çalışır.
      # `gh` runner'da hazır gelir; üçüncü taraf action (ve Node sürümü) gerektirmez.
      - name: Publish GitHub Release
        # Debug APK her derlemede başka bir anahtarla imzalanır; güncelleme olarak kurulamaz, bu yüzden yayımlanmaz
        # (APK yine de 'gitpush-apk' artifact'ında indirilebilir).
        if: steps.version.outputs.release == 'true' && github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        id: publish
        run: |
          {
            echo "APK dosyaları:"; find app/build/outputs -name '*.apk' || true
            apk="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
            [ -n "$apk" ] || { echo "HATA: APK bulunamadı"; exit 1; }
            [ -f release-notes.md ] || echo "Sürüm notu yok." > release-notes.md
            cp "$apk" "Gitpush-${TAG}.apk"
            gh release create "${TAG}" "Gitpush-${TAG}.apk" \
              --target "${GITHUB_SHA}" \
              --title "Gitpush ${TAG}" \
              --notes-file release-notes.md \
              --latest
          } 2>&1 | tee publish.log

      - name: Collect All-reports.txt
        if: always()
        env:
          OUT_VERSION: ${{ steps.version.outcome }}
          OUT_TESTS: ${{ steps.tests.outcome }}
          OUT_KEY: ${{ steps.key.outcome }}
          OUT_RELEASE: ${{ steps.release.outcome }}
          OUT_DEBUG: ${{ steps.debug.outcome }}
          OUT_SIGNED: ${{ steps.key.outputs.signed }}
          OUT_UPLOAD: ${{ steps.upload_apk.outcome }}
          OUT_PUBLISH: ${{ steps.publish.outcome }}
        run: |
          R=All-reports.txt
          {
            echo "=== ALL REPORTS ==="
            echo "Run: ${GITHUB_RUN_ID}  Commit: ${GITHUB_SHA}  Branch: ${GITHUB_REF_NAME}"
            echo "Date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "=== STEP RESULTS ==="
            echo "Compute version : ${OUT_VERSION}"
            echo "Unit tests      : ${OUT_TESTS}"
            echo "Signing key     : ${OUT_KEY}"
            echo "Release signed  : ${OUT_SIGNED:-unknown}"
            echo "Signing detail  : $(cat signing-status.txt 2>/dev/null || echo '(yok)')"
            echo "Release APK     : ${OUT_RELEASE}"
            echo "Debug APK       : ${OUT_DEBUG}"
            echo "Upload APK      : ${OUT_UPLOAD}"
            echo "Publish release : ${OUT_PUBLISH}"
            echo
            echo "=== TOOL VERSIONS ==="
            java -version 2>&1 | head -n 1
            grep -E 'distributionUrl' gradle/wrapper/gradle-wrapper.properties || true
            grep -E 'com.android.application|plugin.compose' build.gradle.kts || true
            grep -E 'compileSdk|targetSdk|minSdk' app/build.gradle.kts || true
            echo
            for f in unit-tests.log release-build.log debug-build.log publish.log; do
              echo "=================== ${f} ==================="
              if [ ! -f "$f" ]; then
                echo "(log file not found - the step did not run)"; echo; continue
              fi
              echo "--- Result ---"
              grep -E '^BUILD (SUCCESSFUL|FAILED)' "$f" || echo "(no BUILD result line)"
              echo
              echo "--- Failure details (full 'What went wrong' block) ---"
              awk '/^\* What went wrong:/{p=1} /^\* Try:/{p=0} p' "$f" | grep . || echo "(no failure)"
              echo
              echo "--- Failed tasks ---"
              grep -E '^> Task .* FAILED' "$f" || echo "(none)"
              echo
              echo "--- Errors and warnings (line number: text) ---"
              grep -nE '^(w|e): |^ERROR|^Error:|^FAILURE|^warning:|^Warning:|WARNING|deprecated|Deprecated|Unable to |^Missing class|FAILED$' "$f" || echo "(none)"
              echo
            done
            echo "=================== APK FILES ==================="
            find app/build/outputs -name '*.apk' 2>/dev/null || true
            echo
            echo "=================== UNIT TEST RESULTS ==================="
            shopt -s globstar nullglob
            xmls=(app/build/test-results/**/*.xml)
            if [ ${#xmls[@]} -eq 0 ]; then
              echo "(no test result files)"
            else
              grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "${xmls[@]}" \
                | awk -F'"' '{t+=$2;s+=$4;f+=$6;e+=$8} END{print "tests="t" skipped="s" failures="f" errors="e}'
              grep -l '<failure\|<error' "${xmls[@]}" | while read -r x; do
                echo "--- FAILED: $x ---"
                grep -A15 '<failure\|<error' "$x" | head -n 60
              done
            fi
          } > "$R" 2>&1
          echo "Report: $(wc -l < "$R") lines"

      # v6+ runs on Node.js 24 (v5 still ran on Node.js 20 -> deprecation warning).
      - name: Upload All-reports.txt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: All-reports
          path: All-reports.txt
          if-no-files-found: warn
